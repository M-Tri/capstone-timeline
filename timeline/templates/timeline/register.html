{% extends "timeline/layout.html" %}

{% block body %}

    <h2>Register Page</h2>

    {% if message %}
    <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'register' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input class="form-control" autofocus type="text" name="username" placeholder="Username">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="mypassword" placeholder="Password">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="myconfirmation" placeholder="Confirm Password">
        </div>
        <input class="btn btn-primary" type="submit" value="Register">
    </form>

    If you already have an account? <a href="{% url 'login' %}">Log In</a>

{% endblock %}
