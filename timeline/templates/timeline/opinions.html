{% extends "timeline/layout.html" %}

{% block body %}


<div class="container">
  {% for opinion in opinions %}
  <div class="row justify-content-around">
    <div class="col-12 col-md-10 col-lg-10">
      <div class="card border-warning mb-4 p-4 rounded shadow-lg">
        <div class="card-body">
          <h5 class="card-title">{{opinion.title}} </h5>
          <h6 class="card-subtitle mb-2 text-body-secondary">{{opinion.writer.username}}</h6>
          <p class="card-text">{{opinion.content}}</p>
        </div>

        {% for label in opinion.labels.all %}
        <div class="d-flex justify-content-center align-items-center">
          <span class="border p-1 ml-1 larger shadow rounded">{{label.name}}</span>
        </div>
        {% endfor %}


        <div class="d-flex justify-content-center align-items-center mt-2">
          <label class="{% if opinion.bias < 40 %}
              bg-success
              {% elif opinion.bias < 70 %}
              bg-warning
              {% else %}
              bg-danger
              {% endif %} rounded-pill text-white small p-2">
            {% if opinion.bias < 40 %}
              Critical Thinker
              {% elif opinion.bias < 70 %}
              Reflecting
              {% else %}
              Venting
              {% endif %}: {{opinion.bias}}
            </label>
        </div>
        <div class="d-flex justify-content-around align-items-center">
          <div class="progress w-25 border border-dark rounded">
            <div class="progress-bar
               progress-bar-striped
              {% if opinion.bias < 40 %}
              bg-success
              {% elif opinion.bias < 70 %}
              bg-warning
              {% else %}
              bg-danger
              {% endif %}"  
              role="progressbar"
              style="width: {{ opinion.bias}}%;" aria-valuenow="{{opinion.bias}}" aria-valuemin="0" aria-valuemax="100">
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  {% empty %}
  <div class="alert alert-info">
    Click <a href="{% url 'create_opinion' %}">link</a> to create one.
  </div>
  {% endfor %}
</div>

{% endblock %}
